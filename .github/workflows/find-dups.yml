name: Find Mathlib duplicates

# Scans leanprover-community/riemann-hypothesis with one of two scanners:
# - dups (FindDups.lean): theorems whose statement is literally a Mathlib theorem;
# - homes (FindHomes.lean): for every declaration, its layer (0 = uses only
#   Mathlib) and the Mathlib module it could live in, i.e. its ToMathlib file.
# Runs only when started by hand from the Actions tab.
run-name: "${{ inputs.scanner }} scan of riemann-hypothesis@${{ inputs.upstream_ref }}"
on:
  workflow_dispatch:
    inputs:
      scanner:
        description: "dups = Mathlib duplicates, homes = ToMathlib homes and layers"
        type: choice
        options: [dups, homes]
        default: dups
      upstream_ref:
        description: "Branch, tag or commit of leanprover-community/riemann-hypothesis to scan"
        default: "main"
      shard_size:
        description: "Modules imported per Lean process (lower it if a shard runs out of memory)"
        default: "5000"
      max_shards:
        description: "Stop after this many shards (0 = all). Use 1 for a test run."
        default: "0"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SHARD_SIZE: ${{ inputs.shard_size }}
      MAX_SHARDS: ${{ inputs.max_shards }}
      SCANNER: ${{ inputs.scanner }}
      SCRIPT: ${{ inputs.scanner == 'homes' && 'FindHomes.lean' || 'FindDups.lean' }}
      OUT: ${{ inputs.scanner == 'homes' && 'homes.csv' || 'duplicates.csv' }}
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Check out this repo (the scanner)
        uses: actions/checkout@v4
        with:
          path: tools

      - name: Check out the RH repo
        uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: ${{ inputs.upstream_ref }}
          path: rh
          fetch-depth: 1

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt oleans (Mathlib + project cache)
        working-directory: rh
        run: |
          lake exe cache get
          lake --no-build --rehash build Main || echo "::warning::rehash check failed, continuing anyway"
          df -h /

      - name: List modules and split into shards
        run: |
          git -C rh ls-tree -r --name-only HEAD src \
            | grep '\.lean$' \
            | sed -e 's#^src/##' -e 's#\.lean$##' -e 's#/#.#g' \
            | grep -v -x 'Challenge' > modules.txt
          echo "$(wc -l < modules.txt) modules"
          mkdir -p shards results
          split -l "$SHARD_SIZE" -d -a 3 modules.txt shards/shard_
          ls shards | wc -l

      - name: Scan shards
        timeout-minutes: 330
        continue-on-error: true
        run: |
          n=0
          for f in shards/shard_*; do
            if [ "$MAX_SHARDS" -gt 0 ] && [ "$n" -ge "$MAX_SHARDS" ]; then break; fi
            n=$((n+1))
            name=$(basename "$f")
            echo "::group::$name ($(wc -l < "$f") modules)"
            ( cd rh && timeout 45m lake env lean --run \
                "$GITHUB_WORKSPACE/tools/dupfinder/$SCRIPT" \
                "$GITHUB_WORKSPACE/$f" "$GITHUB_WORKSPACE/results/$name.csv" ) 2>&1 \
              | tee -a scan.log \
              || echo "::warning::$name failed (see its log group)"
            echo "::endgroup::"
          done

      - name: Merge results and write summary
        if: always()
        run: |
          : > "$OUT"
          for f in results/*.csv; do
            if [ -f "$f" ]; then
              if [ -s "$OUT" ]; then tail -n +2 "$f" >> "$OUT"; else cat "$f" > "$OUT"; fi
            fi
          done
          if [ "$SCANNER" = homes ]; then
            {
              echo "## ToMathlib homes in riemann-hypothesis@${{ inputs.upstream_ref }}"
              echo
              echo '```'
              grep '^SUMMARY' scan.log 2>/dev/null || echo "no shard finished"
              echo '```'
              echo
              if [ -s "$OUT" ]; then python3 tools/dupfinder/summarize_homes.py "$OUT"; fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -s "$OUT" ]; then echo "rh_name,rh_module,mathlib_name,mathlib_module" > "$OUT"; fi
          hits=$(( $(wc -l < "$OUT") - 1 ))
          {
            echo "## Mathlib duplicates in riemann-hypothesis@${{ inputs.upstream_ref }}: $hits hits"
            echo
            echo '```'
            grep '^SUMMARY' scan.log 2>/dev/null || echo "no shard finished"
            echo '```'
            echo
            echo "| RH theorem | Mathlib theorem |"
            echo "|---|---|"
            tail -n +2 "$OUT" | head -n 300 \
              | awk -F, '{ printf "| `%s` | `%s` |\n", $1, $3 }'
            if [ "$hits" -gt 300 ]; then
              echo
              echo "(first 300 shown; full list in the artifact)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scanner == 'homes' && 'mathlib-homes' || 'mathlib-duplicates' }}
          path: |
            ${{ env.OUT }}
            results/
            scan.log
          if-no-files-found: warn
